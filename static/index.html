<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trendcast</title>
<style>
:root{--esp:#1a120c;--ivory:#efe7d6;--amber:#e39b33;--amberd:#b8721c;--muted:#8a7f6d;--cobalt:#2c43f0}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  background:var(--esp);color:var(--ivory);line-height:1.5}
/* ── layout ── */
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 80px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.tag{color:var(--amber);font-weight:700;font-size:15px}
.desc{color:var(--muted);font-size:14px;margin-bottom:22px}
/* ── controls ── */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{border:1px solid rgba(239,231,214,.2);background:transparent;color:var(--ivory);
  padding:7px 15px;border-radius:100px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--esp)}
select,input[type=text]{background:#2a1a10;color:var(--ivory);border:1px solid rgba(239,231,214,.2);
  padding:8px 12px;border-radius:8px;font-size:13.5px}
.btn{background:var(--amber);color:var(--esp);border:0;padding:9px 16px;border-radius:8px;
  font-weight:700;cursor:pointer;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid rgba(239,231,214,.25)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.cobalt{background:var(--cobalt);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
/* ── trend cards ── */
.grid{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.card{background:#2c1f17;border:1px solid rgba(239,231,214,.1);border-radius:14px;padding:18px 20px}
.r1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rank{font-size:24px;font-weight:800;color:var(--amber);min-width:38px}
.ttl{font-size:18px;font-weight:700;flex:1}
.cat{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;
  background:rgba(227,155,51,.16);color:var(--amber);white-space:nowrap;align-self:flex-start}
.cat.warn{background:rgba(220,90,60,.18);color:#f0a58f}
.why{color:var(--muted);font-size:13px;margin:8px 0 4px}
.bars{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bars b{color:var(--ivory)}
.headline{color:#c9bda6;font-size:12.5px;margin-top:7px;font-style:italic}
.note{font-size:11.5px;color:#f0a58f;margin-top:5px}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.lyt-sel{display:flex;gap:6px}
.lyt-btn{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(239,231,214,.2);background:transparent;color:var(--ivory)}
.lyt-btn.on{border-color:var(--amber);color:var(--amber)}
.loading{color:var(--muted);padding:16px 0;font-size:14px}
/* ── result / editor ── */
.result{margin-top:14px;border-top:1px dashed rgba(239,231,214,.14);padding-top:14px;display:none}
/* slideshow preview */
.preview-wrap{display:flex;gap:0;align-items:center;margin-bottom:10px;position:relative}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-behavior:smooth}
.shots img{height:260px;border-radius:8px;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:.15s}
.shots img.active{border-color:var(--amber)}
/* editor panel */
.editor{background:#231610;border-radius:12px;padding:16px;margin-top:10px}
.ed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ed-head span{font-size:13.5px;font-weight:700;color:var(--amber)}
.slide-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stab{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid rgba(239,231,214,.15);background:transparent;color:var(--muted)}
.stab.on{background:var(--amber);color:var(--esp);border-color:var(--amber)}
.field{width:100%;background:#2a1a10;color:var(--ivory);border:1px solid rgba(239,231,214,.18);
  border-radius:8px;padding:10px;font-size:13.5px;font-family:inherit;resize:vertical;min-height:72px}
.field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.field-row label{font-size:12.5px;color:var(--muted);white-space:nowrap}
select.sm{padding:5px 8px;font-size:12.5px}
/* image search panel */
.img-panel{margin-top:10px}
.img-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.img-grid img{width:100px;height:130px;object-fit:cover;border-radius:6px;cursor:pointer;
  border:2px solid transparent;transition:.15s}
.img-grid img:hover,.img-grid img.sel{border-color:var(--amber)}
.img-credit{font-size:11px;color:var(--muted);margin-top:4px}
/* caption + publish */
.copybox{background:#231810;border-radius:8px;padding:10px 12px;font-size:13px;
  color:#d9cdb6;white-space:pre-wrap;margin-top:8px}
.pub{font-size:12.5px;color:var(--muted);margin-top:6px}
</style></head>
<body><div class="wrap">
<header><h1>Trendcast</h1><span class="tag">반자동 트렌드 카드뉴스</span></header>
<div class="desc">뜨는 속도 1차 기준 · 소스 교차 2차 · 자동 이미지 · 편집 후 발행</div>
<div class="controls" id="cats"></div>
<div class="controls" style="margin-top:4px">
  <label style="color:var(--muted);font-size:13px">지역</label>
  <select id="geo">
    <option value="GLOBAL_KR">🌏 글로벌(한국 중심)</option>
    <option value="KR">🇰🇷 한국</option>
    <option value="US">🇺🇸 미국</option>
    <option value="GB">🇬🇧 영국</option>
    <option value="JP">🇯🇵 일본</option>
  </select>
  <button class="btn" id="refresh">트렌드 새로고침</button>
</div>
<div class="grid" id="grid"><div class="loading">불러오는 중…</div></div>
</div>

<script>
const CATS=["전체","경제·금융","정치","문화·연예","스포츠","기술·IT","기타"];
let curCat="전체";
const grid=document.getElementById("grid");

/* ── chips ── */
function chips(){
  const c=document.getElementById("cats"); c.innerHTML="";
  CATS.forEach(k=>{
    const b=document.createElement("button");
    b.className="chip"+(k===curCat?" on":"");
    b.textContent=k; b.onclick=()=>{curCat=k;chips();load();};
    c.appendChild(b);
  });
}

/* ── load trends ── */
async function load(){
  grid.innerHTML='<div class="loading">불러오는 중…</div>';
  const geo=document.getElementById("geo").value;
  const {items}=await fetch(`/api/trends?geo=${geo}&category=${encodeURIComponent(curCat)}&n=6`).then(r=>r.json());
  if(!items||!items.length){grid.innerHTML='<div class="loading">결과 없음</div>';return;}
  grid.innerHTML=""; items.forEach(it=>grid.appendChild(cardEl(it)));
}

/* ── trend card ── */
function cardEl(it){
  const el=document.createElement("div"); el.className="card";
  const vel=(it.velocity==null)?"신규 관측":((it.velocity*100).toFixed(0)+"%");
  const warn=it.sensitive?"warn":"";
  el.innerHTML=`
    <div class="r1">
      <div class="rank">${it.rank}</div>
      <div class="ttl">${esc(it.title_ko||it.title)}
        ${it.title_ko&&it.title_ko!==it.title?`<span style="font-size:12px;color:var(--muted);font-weight:500"> · ${esc(it.title)}</span>`:""}
        <div class="why">왜 떴나 · ${esc(it.why)}</div></div>
      <div class="cat ${warn}">${it.sensitive?"⚠ ":""}${it.category}</div>
    </div>
    <div class="bars">
      <span>트렌드지수 <b>${it.trend_index}</b></span>
      <span>소스교차 <b>${it.confidence}×</b></span>
      <span>최종점수 <b>${it.final}</b></span>
      <span>상승률 <b>${vel}</b></span>
      <span>소스 <b>${it.sources.join(", ")}</b></span>
    </div>
    ${(it.headline_ko||it.headline)?`<div class="headline">"${esc(it.headline_ko||it.headline)}"</div>`:""}
    ${it.sensitive?'<div class="note">※ 민감 주제 — 사실 전달만 생성, 발행은 직접 판단하세요.</div>':""}
    <div class="act">
      <button class="btn gen">카드뉴스 만들기</button>
      <span style="font-size:12px;color:var(--muted)">레이아웃</span>
      <div class="lyt-sel">
        <button class="lyt-btn on" data-lyt="dark">다크</button>
        <button class="lyt-btn" data-lyt="light">라이트</button>
        <button class="lyt-btn" data-lyt="cobalt">코발트</button>
      </div>
    </div>
    <div class="result"></div>`;
  // layout toggle
  el.querySelectorAll(".lyt-btn").forEach(b=>{
    b.onclick=()=>{el.querySelectorAll(".lyt-btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");}
  });
  el.querySelector(".gen").onclick=()=>generate(it,el);
  return el;
}

/* ── generate ── */
async function generate(it,el){
  const box=el.querySelector(".result"), btn=el.querySelector(".gen");
  const lyt=el.querySelector(".lyt-btn.on")?.dataset.lyt||"dark";
  btn.disabled=true; btn.textContent="생성 중…";
  box.style.display="block"; box.innerHTML='<div class="loading">이미지 수집 + 렌더링 중… (10~20초)</div>';
  try{
    const d=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...it,layout:lyt})}).then(r=>r.json());
    box.innerHTML=""; box.appendChild(editorEl(d,it));
  }catch(e){box.innerHTML='<div class="note">오류: '+e+'</div>';}
  btn.disabled=false; btn.textContent="다시 만들기";
}

/* ── editor ── */
function editorEl(d,it){
  const wrap=document.createElement("div");
  // state
  let slides=[...d.copy.slides];
  let imgUrl=d.img_credit?.url||null;
  let layout=d.layout||"dark";
  let selImg=null;
  let curSlide=0;

  function render(){
    wrap.innerHTML=`
      <!-- slide preview -->
      <div class="preview-wrap">
        <div class="shots" id="shots-${it.rank}">
          ${d.images.map((u,i)=>`<img src="${u}" class="${i===0?"active":""}" data-i="${i}">`).join("")}
        </div>
      </div>
      <!-- editor panel -->
      <div class="editor">
        <div class="ed-head">
          <span>✏ 편집</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <select class="sm" id="lyt-sel-${it.rank}">
              <option value="dark" ${layout==="dark"?"selected":""}>다크</option>
              <option value="light" ${layout==="light"?"selected":""}>라이트</option>
              <option value="cobalt" ${layout==="cobalt"?"selected":""}>코발트</option>
            </select>
            <button class="btn sm" id="apply-${it.rank}">적용 (PNG 재생성)</button>
          </div>
        </div>
        <!-- slide tabs -->
        <div class="slide-tabs">
          ${slides.map((_,i)=>`<button class="stab${i===curSlide?" on":""}" data-si="${i}">${i+1}장</button>`).join("")}
        </div>
        <!-- text editor -->
        <div class="field-row"><label>제목</label></div>
        <textarea class="field" id="ttl-${it.rank}" style="min-height:44px">${(slides[curSlide]||{}).title||""}</textarea>
        <div class="field-row" style="margin-top:8px"><label>본문 (**볼드** 마커 사용 가능)</label></div>
        <textarea class="field" id="txt-${it.rank}" style="min-height:110px">${(slides[curSlide]||{}).body||""}</textarea>
        <!-- 폰트/정렬 컨트롤 -->
        <div class="field-row" style="margin-top:10px;gap:14px">
          <label>글자 크기</label>
          <input type="range" id="fs-${it.rank}" min="0.7" max="1.4" step="0.05"
            value="${(slides[curSlide]||{}).fontScale||1}" style="flex:1">
          <span id="fsv-${it.rank}" style="font-size:12px;color:var(--amber);min-width:36px">${Math.round(((slides[curSlide]||{}).fontScale||1)*100)}%</span>
        </div>
        <div class="field-row" style="gap:8px">
          <label>정렬</label>
          <button class="btn sm ghost algn" data-a="left" data-r="${it.rank}">왼쪽</button>
          <button class="btn sm ghost algn" data-a="center" data-r="${it.rank}">가운데</button>
        </div>
        <!-- image swap -->
        <div class="img-panel">
          <div class="field-row" style="margin-top:10px">
            <label>이 슬라이드 사진 교체</label>
            <input type="text" id="imgq-${it.rank}" placeholder="검색어 (영문 권장, 예: seoul city)" style="flex:1">
            <button class="btn sm ghost" id="imgsearch-${it.rank}">검색</button>
          </div>
          <div class="img-grid" id="imgres-${it.rank}"></div>
          ${imgUrl?`<div class="img-credit">현재 이미지 출처: Unsplash${d.img_credit?.author?" · "+d.img_credit.author:""}</div>`:"<div class='img-credit'>이미지 없음 (UNSPLASH_ACCESS_KEY 미설정)</div>"}
        </div>
      </div>
      <!-- caption + publish -->
      <div class="copybox" id="cap-${it.rank}" contenteditable="true">${d.caption}</div>
      <div class="act" style="margin-top:8px">
        <button class="btn ghost sm pubi">인스타 예약</button>
        <button class="btn ghost sm pubt">스레드 예약</button>
      </div>
      <div class="pub" id="pub-${it.rank}"></div>`;

    // slide tab click
    wrap.querySelectorAll(".stab").forEach(b=>{
      b.onclick=()=>{
        const ta=wrap.querySelector(`#txt-${it.rank}`);
        const tt=wrap.querySelector(`#ttl-${it.rank}`);
        slides[curSlide]={...(slides[curSlide]||{}),title:tt.value,body:ta.value};
        curSlide=parseInt(b.dataset.si);
        wrap.querySelectorAll(".stab").forEach(x=>x.classList.remove("on")); b.classList.add("on");
        tt.value=(slides[curSlide]||{}).title||"";
        ta.value=(slides[curSlide]||{}).body||"";
        // 스타일 컨트롤 갱신
        const fs=wrap.querySelector(`#fs-${it.rank}`);
        const fsv=wrap.querySelector(`#fsv-${it.rank}`);
        if(fs){const v=(slides[curSlide]||{}).fontScale||1; fs.value=v; if(fsv)fsv.textContent=Math.round(v*100)+"%";}
      };
    });
    // 글자 크기 슬라이더
    const fsEl=wrap.querySelector(`#fs-${it.rank}`);
    if(fsEl) fsEl.oninput=()=>{
      const v=parseFloat(fsEl.value);
      slides[curSlide]={...(slides[curSlide]||{}),fontScale:v};
      const fsv=wrap.querySelector(`#fsv-${it.rank}`); if(fsv)fsv.textContent=Math.round(v*100)+"%";
    };
    // 정렬 버튼
    wrap.querySelectorAll(`.algn[data-r="${it.rank}"]`).forEach(bt=>{
      bt.onclick=()=>{
        slides[curSlide]={...(slides[curSlide]||{}),align:bt.dataset.a};
        wrap.querySelectorAll(`.algn[data-r="${it.rank}"]`).forEach(x=>x.classList.remove("on"));
        bt.classList.add("on");
      };
    });
    // preview click highlight
    wrap.querySelectorAll(`#shots-${it.rank} img`).forEach(img=>{
      img.onclick=()=>{
        wrap.querySelectorAll(`#shots-${it.rank} img`).forEach(x=>x.classList.remove("active"));
        img.classList.add("active");
      };
    });
    // layout change
    const lytSel=wrap.querySelector(`#lyt-sel-${it.rank}`);
    if(lytSel) lytSel.onchange=()=>{layout=lytSel.value;};
    // apply button
    const applyBtn=wrap.querySelector(`#apply-${it.rank}`);
    if(applyBtn) applyBtn.onclick=async()=>{
      const ta=wrap.querySelector(`#txt-${it.rank}`);
      const tt=wrap.querySelector(`#ttl-${it.rank}`);
      slides[curSlide]={...(slides[curSlide]||{}),title:tt.value,body:ta.value};
      applyBtn.disabled=true; applyBtn.textContent="재생성 중…";
      const res=await fetch("/api/rerender",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({slides,ko_title:d.copy.ko_title,why_ko:d.copy.why_ko,
          bg_url:d.bg_url, slide_imgs:d.slide_imgs||[],
          sensitive:it.sensitive||false})}).then(r=>r.json());
      // update preview
      const shots=wrap.querySelector(`#shots-${it.rank}`);
      if(shots) shots.innerHTML=res.images.map((u,i)=>`<img src="${u}?t=${Date.now()}" class="${i===0?"active":""}" data-i="${i}">`).join("");
      d.images=res.images;
      // re-bind preview clicks
      wrap.querySelectorAll(`#shots-${it.rank} img`).forEach(img=>{
        img.onclick=()=>{wrap.querySelectorAll(`#shots-${it.rank} img`).forEach(x=>x.classList.remove("active"));img.classList.add("active");};
      });
      applyBtn.disabled=false; applyBtn.textContent="적용 (PNG 재생성)";
    };
    // image search
    const imgSearchBtn=wrap.querySelector(`#imgsearch-${it.rank}`);
    if(imgSearchBtn) imgSearchBtn.onclick=async()=>{
      const q=wrap.querySelector(`#imgq-${it.rank}`).value.trim();
      if(!q) return;
      imgSearchBtn.disabled=true; imgSearchBtn.textContent="검색 중…";
      const res=await fetch(`/api/images/search?q=${encodeURIComponent(q)}&n=6`).then(r=>r.json());
      const grid2=wrap.querySelector(`#imgres-${it.rank}`);
      if(!res.results.length){grid2.innerHTML='<span style="font-size:12px;color:var(--muted)">결과 없음 (UNSPLASH_ACCESS_KEY 필요)</span>';}
      else{
        grid2.innerHTML=res.results.map((img,i)=>
          `<img src="${img.thumb}" data-full="${img.url}" data-author="${img.author||""}" title="${img.author||""}">`
        ).join("");
        grid2.querySelectorAll("img").forEach(img=>{
          img.onclick=()=>{
            grid2.querySelectorAll("img").forEach(x=>x.classList.remove("sel"));
            img.classList.add("sel");
            // 현재 슬라이드에 사진 지정 (img=true 강제)
            slides[curSlide]={...(slides[curSlide]||{}),img:true,img_url:img.dataset.full};
          };
        });
      }
      imgSearchBtn.disabled=false; imgSearchBtn.textContent="검색";
    };
    // publish
    wrap.querySelector(".pubi").onclick=()=>doPublish(d,"instagram",wrap,it);
    wrap.querySelector(".pubt").onclick=()=>doPublish(d,"threads",wrap,it);
  }

  render(); return wrap;
}

/* ── publish ── */
async function doPublish(d,platform,wrap,it){
  const p=wrap.querySelector(`#pub-${it.rank}`)||wrap.querySelector(".pub");
  if(p) p.textContent="요청 중…";
  const caption=(wrap.querySelector(`#cap-${it.rank}`)||{}).innerText||d.caption;
  const res=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({images:d.images,caption,platform})}).then(r=>r.json());
  if(p) p.textContent=res.status==="dry_run"
    ?`드라이런(${platform}) — 자격증명 미설정. 이미지 ${res.would_post?.images?.length||0}장 준비됨.`
    :res.status==="published"?`발행 완료(${platform}) ✓`
    :`(${platform}) ${res.status}: ${res.reason||res.error||""}`;
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("refresh").onclick=load;
chips(); load();
</script></body></html>
